spring:
  #  redis:
  #    database: 0
  #    host: ${HOST_REDIS}
  #    port: ${PORT_REDIS}
  #    password: ${PASS_REDIS}
  #    timeout: 60000
  encr: ${EPY}
  #  kfpass: ${KAFKA_PASS}
  #  kfuser: ${KAFKA_USER}
  application:
    name: auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB}?useSSL=false&serverTimezone=UTC
    username: ${DBUSER}
    password: ${DBPASS}

  # JPA properties
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
    generate-ddl: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: info, health, metrics, prometheus

info:
  app: api-login by joao4018
  website: https://www.linkedin.com/in/joao4018/
  github: https://github.com/joao4018

scheme: [http,https]

ribbon:
  ReadTimeout: 2147483647
  ConnectTimeout: 2147483647
